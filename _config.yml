# =============================================================
#  SETTINGS YOU CAN CHANGE
# =============================================================

# Name shown at the top of every page
title: Sample Mount Catalogue

# One line shown under the title on the home page
description: Epoxy grain mounts with maps, sample details and data

# Pre-fills the "Affiliation" box in the New mount form
default_affiliation: University of Melbourne

# The short address printed in the QR codes.
# Leave this as "" until you have your own domain.
# Then set it to something like "HTTP://XTL.AU" (all capitals
# keeps the QR code as small as possible).
qr_base: "HTTP://MNTS.AU"

# Where EarthBank links on the site point (the data itself is still read from the EarthBank API)
earthbank_web: "https://app.ausgeochem.org"

# Address of the sign-in service (see _signin/SETUP.md), e.g.
# "https://mounts-signin.yourname.workers.dev". When set, people
# can sign in with GitHub and save changes straight from the site.
# Leave as "" to always use GitHub's own pages for saving.
auth_url: "https://mounts-signin.malcmcm.workers.dev"

# =============================================================
#  LEAVE EVERYTHING BELOW AS IT IS
# =============================================================
exclude:
  - README.md
  - _signin
