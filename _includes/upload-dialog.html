<dialog id="upload-dialog" class="dialog">
  <form method="dialog" id="upload-form" novalidate>
    <div class="dialog-head">
      <h2>Add files to {{ page.mount_id }}</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">&times;</button>
    </div>
    <div class="dialog-body">
      <label class="drop" id="upload-drop">
        <input type="file" id="upload-input" multiple hidden>
        <span><strong>Drop files here</strong> or <span class="link-like">choose files</span></span>
        <small>Photos and map images (JPG or PNG) go under Photos and hi-res images; everything else under Data files. Up to 25 MB each.
          For large originals, upload a small preview here, then use <strong>Add hi-res download link</strong> under it to link the full file (e.g. on Mediaflux).</small>
      </label>
      <ul class="upload-list" id="upload-list"></ul>
      <p class="hint error" id="upload-error"></p>
      <div class="saved" id="upload-saved" hidden>
        <span aria-hidden="true">✓</span>
        <div><strong>Uploaded.</strong> <span id="upload-saved-text"></span></div>
      </div>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary" id="upload-btn" disabled>Upload</button>
    </div>
  </form>
</dialog>
<script src="{{ '/assets/upload.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
