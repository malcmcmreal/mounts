<div class="list-tools">
  <input id="split-q" class="filter" type="search" placeholder="Search sample, catalogue number, country, rock type, age, PID or collector" autocomplete="off">
  <label class="group-by">Mineral
    <select id="split-mineral"><option value="">Any</option></select>
  </label>
  <label class="group-by">Split
    <select id="split-prep"><option value="">Any</option></select>
  </label>
  <div class="qty-filter" title="Vial amount, 0 (empty) to 5 (full)">
    <span class="small muted">Amount</span>
    <div class="dual-range"><div class="dr-track"><i id="qty-fill"></i></div>
      <input type="range" id="qty-lo" min="0" max="5" step="1" value="0" aria-label="Lowest vial amount">
      <input type="range" id="qty-hi" min="0" max="5" step="1" value="5" aria-label="Highest vial amount"></div>
    <span class="mono small" id="qty-out">0–5</span>
    <label class="check small" title="Vials whose amount hasn't been checked"><input type="checkbox" id="qty-unrated" checked> unrated</label>
  </div>
  <label class="group-by">Project
    <select id="split-project"><option value="">Any</option></select>
  </label>
  <label class="group-by">Group by
    <select id="split-group">
      <option value="">None</option>
      <option value="project">Project</option>
      <option value="country">Country</option>
      <option value="mineral">Minerals</option>
      <option value="rock">Rock type</option>
      <option value="collector">Collected by</option>
      {% unless include.drawer %}<option value="drawer">Drawer</option>{% endunless %}
    </select>
  </label>
  <label class="check small"><input type="checkbox" id="split-mounted"> In a mount</label>
  <button type="button" class="btn small" id="split-reset" hidden title="Clear the search and every filter">↺ Reset filters</button>
</div>
